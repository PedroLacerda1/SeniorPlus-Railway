<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinição de senha - Senior+</title>
</head>
<body>
  <main>
    <h1>Redefinir sua senha</h1>
    <p>Recebemos uma solicitação para redefinir a senha da sua conta Senior+.</p>
    <p>
      <a th:href="${resetUrl}">Criar nova senha</a>
    </p>
    <p>Este link expira em 24 horas. Se você não solicitou a redefinição, ignore este e-mail.</p>
    <p th:text="${resetUrl}">Link para redefinir senha</p>
  </main>
</body>
</html>
