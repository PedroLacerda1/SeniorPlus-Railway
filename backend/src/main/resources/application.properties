spring.application.name=seniorplus
server.port=${PORT:8080}

# MySQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://hopper.proxy.rlwy.net:20356/railway}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Thymeleaf is not used for this service; skip template scan noise
spring.thymeleaf.check-template-location=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:mysql://hopper.proxy.rlwy.net:20356/railway}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME:root}
spring.flyway.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# RabbitMQ medication reminders; disabled by default outside Docker Compose
app.reminders.rabbitmq.enabled=${APP_REMINDERS_RABBITMQ_ENABLED:false}
app.reminders.rabbitmq.exchange=seniorplus.reminders
app.reminders.rabbitmq.queue=seniorplus.medication-reminders
app.reminders.rabbitmq.routing-key=medication.reminder
app.reminders.rabbitmq.dead-letter-exchange=seniorplus.reminders.dlx
app.reminders.rabbitmq.dead-letter-queue=seniorplus.medication-reminders.dlq
app.reminders.rabbitmq.dead-letter-routing-key=medication.reminder.failed
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.initial-interval=1s
spring.rabbitmq.template.retry.multiplier=2
spring.rabbitmq.template.retry.max-interval=10s
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=1

# WhatsApp (não colocar apikey aqui) - obtido do ENV
zap.whatsapp.api-key=${ZAP_WHATSAPP_APIKEY:}
zap.whatsapp.telefone=${ZAP_WHATSAPP_TELEFONE:+5511999999999}

# Email (use envs)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security / JWT
# jwt.secret DEVE vir de variável de ambiente com comprimento seguro
jwt.secret=${JWT_SECRET:}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# Remova/evite defaults inseguros:
# removido: spring.security.user.name/password

# Swagger UI
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
